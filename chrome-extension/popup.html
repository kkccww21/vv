<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }
    
    .header {
      padding: 16px 16px 12px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header h3::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: #3b82f6;
      border-radius: 2px;
    }
    
    .settings-btn {
      padding: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 16px;
      transition: color 0.2s;
    }
    
    .settings-btn:hover { color: #3b82f6; }

    .settings-panel {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: none;
    }

    .settings-panel.active { display: block; }

    .settings-panel label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .settings-panel input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .settings-panel input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    .settings-save {
      width: 100%;
      padding: 8px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .settings-save:hover { background: #2563eb; }
    
    .content {
      padding: 12px 16px;
    }
    
    .scan-btn {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .scan-btn:hover { background: #2563eb; }
    .scan-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    
    .device-list {
      margin-top: 12px;
    }
    
    .device-item {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    
    .device-item:hover {
      border-color: #3b82f6;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
    }
    
    .device-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    
    .device-name {
      font-size: 14px;
      font-weight: 500;
      color: #111827;
    }
    
    .device-ip {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }
    
    .device-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    
    .cast-btn {
      padding: 6px 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .cast-btn:hover { background: #2563eb; }
    
    .delete-btn {
      padding: 6px 10px;
      background: transparent;
      color: #ef4444;
      border: 1px solid #fecaca;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .delete-btn:hover { background: #fef2f2; }
    
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #9ca3af;
    }
    
    .empty-state p:first-child {
      font-size: 14px;
      margin-bottom: 4px;
    }
    
    .empty-state p:last-child {
      font-size: 12px;
    }
    
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }
    
    .add-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #10b981;
      border: 1px solid #10b981;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .add-btn:hover { background: #ecfdf5; }
    
    .status {
      text-align: center;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }
    
    .status.success { background: #ecfdf5; color: #059669; }
    .status.error { background: #fef2f2; color: #dc2626; }
    .status.info { background: #eff6ff; color: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <h3>DLNA 投屏</h3>
    <button class="settings-btn" id="settingsBtn" title="设置">⚙️</button>
  </div>
  <div class="content">
    <button class="scan-btn" id="refreshBtn">扫描设备</button>
    <div class="status" id="status" style="display: none;"></div>
    <div class="device-list" id="deviceList"></div>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <label>投影仪 IP 地址</label>
    <input type="text" id="targetIpInput" placeholder="例如：192.168.3.134">
    <button class="settings-save" id="settingsSaveBtn">保存</button>
  </div>
  <div class="footer">
    <button class="add-btn" id="addBtn">+ 手动添加</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
